<section class="cartao">
  <h1>Cadastro</h1>
  <form (ngSubmit)="cadastrar()">
    <label for="nome">Nome</label>
    <input id="nome" name="nome" type="text" [ngModel]="nome()" (ngModelChange)="nome.set($event)" />

    <label for="email-cadastro">E-mail</label>
    <input
      id="email-cadastro"
      name="email"
      type="email"
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
    />

    <label for="senha-cadastro">Senha</label>
    <input
      id="senha-cadastro"
      name="senha"
      type="password"
      [ngModel]="senha()"
      (ngModelChange)="senha.set($event)"
    />

    <button type="submit">Cadastrar</button>
    @if (mensagem()) {
      <p class="mensagem">{{ mensagem() }}</p>
    }
  </form>
</section>
